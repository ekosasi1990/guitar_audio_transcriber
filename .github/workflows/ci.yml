name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Smoke test
        run: python -c "import src.backend.api"
      - name: Check formatting
        run: python -m black --check src tests tools backend_launcher.py
      - name: Run tests
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check src/frontend/main.js
          node --check src/frontend/preload.js
          node --check src/frontend/js/app.js
          node --check src/frontend/js/recorder.js
      - name: Check formatting
        run: npm run check:frontend
      - name: Check recorder
        run: node tests/recorder_checks.cjs
